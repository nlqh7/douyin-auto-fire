name: test-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller pillow
      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci
      - name: Test Python
        run: python -m pytest -q
      - name: Test Electron
        working-directory: desktop
        run: npm test
      - name: Build icon and backend
        run: |
          python scripts/build_assets.py
          python scripts/download_stickers.py
          python -m PyInstaller --noconfirm --onefile --noconsole --name manage --collect-all playwright --collect-all tzdata --distpath build --workpath build/work --specpath build/spec manage.py
      - name: Build portable application
        working-directory: desktop
        run: npm run dist
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkKeeper-windows-x64
          path: desktop/dist/SparkKeeper-*-win-x64.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/SparkKeeper-*-win-x64.exe
          generate_release_notes: true
